<text x="727.5" y="217.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">layers 5 / 11 / 17 / 23</text>
<text x="727.5" y="241.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">LayerNorm + token L2</text>
<text x="727.5" y="265.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">1024-D patch tokens</text>
