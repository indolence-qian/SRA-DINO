<text x="405.0" y="634.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">8 affine coupling blocks</text>
<text x="405.0" y="658.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">fixed permutations</text>
<rect x="545" y="582" width="210" height="94" rx="12" fill="#fff0e3" stroke="#bb895a" stroke-width="2"/>
