<text x="442.5" y="241.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">each view: 512 x 512</text>
<text x="442.5" y="265.78" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">crop fraction = 0.6</text>
