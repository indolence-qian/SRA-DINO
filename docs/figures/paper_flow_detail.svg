<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320" role="img">
<title>Inside an affine coupling block of the current Flow</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#45566b"/></marker></defs>
<rect width="1600" height="320" fill="white"/>
<text x="800" y="40" fill="#203348" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" font-weight="700">Flow detail: repeat the affine coupling block eight times per DINO layer</text>
<rect x="25" y="125" width="145" height="85" rx="12" fill="#edf4fb" stroke="#55789c" stroke-width="2"/>
<text x="97.5" y="161.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">input h</text>
<text x="97.5" y="185.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">256 channels</text>
<rect x="210" y="125" width="185" height="85" rx="12" fill="#edf4fb" stroke="#55789c" stroke-width="2"/>
<text x="302.5" y="161.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">fixed permutation</text>
<text x="302.5" y="185.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">split a / b</text>
<rect x="440" y="78" width="275" height="85" rx="12" fill="#fff0e3" stroke="#bb895a" stroke-width="2"/>
<text x="577.5" y="114.44" fill="#203348" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="400">a -&gt; Linear -&gt; GELU -&gt; Linear</text>
<text x="577.5" y="137.44" fill="#203348" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="400">predict scale s and shift t</text>
<rect x="770" y="125" width="285" height="85" rx="12" fill="#fff0e3" stroke="#bb895a" stroke-width="2"/>
<text x="912.5" y="161.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">keep a unchanged</text>
<text x="912.5" y="185.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">b_out = b * exp(s) + t</text>
<rect x="1100" y="125" width="190" height="85" rx="12" fill="#edf4fb" stroke="#55789c" stroke-width="2"/>
<text x="1195.0" y="161.12" fill="#203348" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="400">concatenate</text>
<text x="1195.0" y="186.12" fill="#203348" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="400">[a, b_out]</text>
<rect x="1330" y="125" width="240" height="85" rx="12" fill="#edf4fb" stroke="#55789c" stroke-width="2"/>
<text x="1450.0" y="161.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">output to next block</text>
<text x="1450.0" y="185.28" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">accumulate sum(s)</text>
<path d="M170,167 L210,167" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="210,167 200.0,171.5 200.0,162.5" fill="#45566b"/>
<path d="M395,145 L420,145 L420,120 L440,120" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="440,120 430.0,124.5 430.0,115.5" fill="#45566b"/>
<path d="M395,187 L740,187 L770,187" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="770,187 760.0,191.5 760.0,182.5" fill="#45566b"/>
<text x="570" y="214" fill="#52667a" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400">b bypasses the conditioner MLP</text>
<path d="M715,120 L740,120 L740,145 L770,145" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="770,145 760.0,149.5 760.0,140.5" fill="#45566b"/>
<path d="M1055,167 L1100,167" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="1100,167 1090.0,171.5 1090.0,162.5" fill="#45566b"/>
<path d="M1290,167 L1330,167" fill="none" stroke="#45566b" stroke-width="2.3"/>
<polygon points="1330,167 1320.0,171.5 1320.0,162.5" fill="#45566b"/>
<text x="800" y="265" fill="#203348" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="400">s = 1.5 * tanh(s_raw / 1.5) | block log|det J| = sum(s) | NLL = [0.5 * sum(z^2 + log(2*pi)) - log|det J|] / D</text>
<text x="800" y="296" fill="#52667a" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="400">The Flow is a density estimator, not optical flow. Source anomaly labels enter the training loss, not this inference block.</text>
</svg>